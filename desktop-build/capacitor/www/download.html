<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="下载 SecureChat 多平台客户端">
  <title>下载 SecureChat</title>
  <style>
    :root { color-scheme: light; --green: #07c160; --ink: #17211b; --muted: #6f7b74; --line: #e5ebe7; --bg: #f5f8f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: linear-gradient(145deg, #fff, var(--bg)); font: 15px/1.6 "Microsoft YaHei", "Segoe UI", sans-serif; }
    a { color: inherit; }
    .page { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 64px; }
    header { text-align: center; margin-bottom: 34px; }
    .brand { color: var(--green); font-size: 30px; font-weight: 750; letter-spacing: .02em; }
    header p { margin: 6px 0 0; color: var(--muted); }
    .status { min-height: 25px; color: var(--muted); text-align: center; margin: 14px 0; }
    .recommend { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 28px; border: 2px solid var(--green); border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgba(13, 74, 43, .09); }
    .recommend-label { color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .platform-name { margin: 2px 0 2px; font-size: 24px; font-weight: 700; }
    .details { margin: 0; color: var(--muted); }
    .note { margin: 8px 0 0; font-size: 12.5px; color: #a06a1f; background: #fdf6e7; border: 1px solid #f0dfb6; border-radius: 8px; padding: 8px 10px; }
    .version { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .download { display: inline-block; padding: 11px 22px; border-radius: 9px; color: #fff; background: var(--green); text-decoration: none; font-weight: 700; white-space: nowrap; }
    .download:hover { filter: brightness(.94); }
    .download.disabled { color: #89958e; background: #edf1ee; pointer-events: none; }
    .download.alt { color: var(--green); background: #e9f7ef; margin-top: 8px; }
    .other { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.8); overflow: hidden; }
    .other summary { padding: 15px 18px; cursor: pointer; font-weight: 650; list-style-position: inside; }
    .other summary:hover { background: #fff; }
    .platform-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; padding: 0 14px 14px; }
    .platform { display: flex; min-height: 126px; flex-direction: column; padding: 16px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .platform h3 { margin: 0 0 2px; font-size: 17px; }
    .platform .details { flex: 1; font-size: 13px; }
    .platform .version { margin: 7px 0 10px; }
    .platform .download { align-self: flex-start; padding: 7px 14px; font-size: 13px; }
    .back { display: block; margin-top: 28px; color: var(--muted); text-align: center; text-decoration: none; }
    .back:hover { color: var(--green); }
    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 480px); padding-top: 30px; }
      .recommend { grid-template-columns: 1fr; padding: 22px; }
      .recommend .download { width: 100%; text-align: center; }
      .platform-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header><div class="brand">SecureChat</div><p>端到端加密聊天 · 多平台客户端下载</p></header>
    <div id="status" class="status" role="status" aria-live="polite">正在获取最新版本…</div>
    <section id="recommended" class="recommend" aria-labelledby="recommended-title"></section>
    <details class="other" open>
      <summary>其他平台</summary>
      <div id="platform-list" class="platform-list"></div>
    </details>
     <a class="back" href="/">返回 SecureChat</a>
  </main>
  <script src="download.js"></script>
</body>
</html>
