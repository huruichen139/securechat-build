name: Build HarmonyOS HAP (experimental)

# 实验性：在 GitHub Actions 上安装 HarmonyOS 命令行工具链并构建 .hap。
# 注意：DevEco 不开源、无官方静默安装，公共 runner 上需下载官方 command-line-tools + ohos-sdk，
#       华为 SDK 镜像在 CI 上访问与许可均可能受限，存在失败风险。失败不影响其他平台发布。
# 触发：仅手动（workflow_dispatch）。
on:
  workflow_dispatch:

jobs:
  harmony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache HarmonyOS SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/ohos-commandline-tools
            ~/ohos-sdk
          key: ${{ runner.os }}-ohos-sdk

      - name: Download HarmonyOS command-line-tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ohos-commandline-tools
          cd ~/ohos-commandline-tools
          # Official HarmonyOS command-line-tools (Linux x64):
          # https://developer.huawei.com/consumer/cn/deveco-studio/
          # Download is large; try official URL, fallback to known mirror.
          URL="https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/av/v3/HarmonyOS/command_line_tools_linux_x86_64_5.0.0.zip"
          if curl -sSI -m 20 "$URL" | grep -q "200"; then
            echo "downloading from official URL"
            curl -sSL --retry 3 "$URL" -o clt.zip
          else
            echo "official URL unreachable on CI"
          fi
          test -f clt.zip && unzip -q clt.zip -d . || echo "command-line-tools download failed"

      - name: Download HarmonyOS SDK (API 12, linux)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ohos-sdk
          cd ~/ohos-sdk
          # Linux ohos-sdk 5.0.0 (12) from Huawei CDN. Large (~GB).
          SDK_URL="https://contentcenter-drcn-dbankcdn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/av/v3/HarmonyOS/ohos-sdk-linux-v5.0.0.zip"
          if curl -sSI -m 20 "$SDK_URL" | grep -q "200"; then
            curl -sSL --retry 3 "$SDK_URL" -o sdk.zip
            unzip -q sdk.zip -d . || echo "sdk unzip failed"
          else
            echo "SDK URL unreachable on CI"
          fi

      - name: List downloaded tooling
        run: |
          echo "--- command-line-tools ---"
          ls -la ~/ohos-commandline-tools/ 2>/dev/null || true
          echo "--- sdk ---"
          ls -la ~/ohos-sdk/ 2>/dev/null || true

      - name: Build HAP
        working-directory: desktop-build/harmony
        env:
          DEVECO_SDK_HOME: ${{ github.workspace }}/../ohos-sdk
          OHOS_SDK_HOME: ${{ github.workspace }}/../ohos-sdk
          DEVECO_HVIGOR_HOME: ${{ github.workspace }}/../ohos-commandline-tools
        run: |
          export NODE_HOME=$(which node)
          cd "$GITHUB_WORKSPACE/desktop-build/harmony"
          # Try hvigor if available from command-line-tools; otherwise report clear error.
          if command -v hvigorw >/dev/null 2>&1; then
            hvigorw assembleHap --mode module -p product=default --no-daemon -p debuggable=false 2>&1 || true
          elif [ -f ~/ohos-commandline-tools/hvigor/bin/hvigorw ]; then
            chmod +x ~/ohos-commandline-tools/hvigor/bin/hvigorw
            ~/ohos-commandline-tools/hvigor/bin/hvigorw assembleHap --mode module -p product=default --no-daemon -p debuggable=false 2>&1 || true
          else
            echo "hvigor toolchain not found in command-line-tools"
            find ~/ohos-commandline-tools -name "*hvigor*" 2>/dev/null | head -5 || true
          fi
          echo "=== find hap ==="
          find . -name "*.hap" 2>/dev/null | head -10 || true

      - name: Upload HAP (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Harmony-Flutter
          path: |
            desktop-build/harmony/**/*.hap
          if-no-files-found: ignore
