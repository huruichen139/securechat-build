name: Build Flutter Windows

# �?GitHub Actions 官方 windows-latest runner 构建 Flutter 原生 Windows 客户端�?
# 本地构建�?Microsoft CDN 下载限速（VCTools ~115KB/s）阻塞，�?GitHub runner
# 自带完整 VS C++ 工具链，可在此按正常速度构建，规避本地网络瓶颈�?
# 触发：手动（workflow_dispatch）或�?tag�?
# 产物命名匹配服务�?PLATFORM_FILES：SecureChat-<latest>-windows.exe / .zip�?
# <latest> �?server �?version.json �?latest 取（此处固定 1.62.3，改版本时同步）�?

on:
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本号（须与服务�?version.json �?latest 一致）'
        required: true
        default: '1.62.3'
  push:
    tags: [ 'flutter-win-*' ]

jobs:
  flutter-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: v
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '1.62.3' }}".Trim()
          if ($ver -eq '') { $ver = '1.62.3' }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get

      - name: Analyze
        working-directory: desktop-build/flutter/securechat
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (release)
        working-directory: desktop-build/flutter/securechat
        run: flutter build windows --release

      - name: Build portable zip
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $src = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          if (Get-Command Compress-Archive -ErrorAction SilentlyContinue) {
            Compress-Archive -Path "$src\*" -DestinationPath "dist\SecureChat-$ver-windows.zip" -Force
          } else {
            7z a "dist\SecureChat-$ver-windows.zip" $src
          }

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          & $iscc "tools\installer.iss" /dAppVer=$ver
          Get-ChildItem dist -Filter "*.exe" | Select-Object -ExpandProperty Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Flutter-Windows
          path: |
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.exe
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.zip
