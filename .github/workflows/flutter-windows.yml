name: Build Flutter Windows

# 鐢?GitHub Actions 瀹樻柟 windows-latest runner 鏋勫缓 Flutter 鍘熺敓 Windows 瀹㈡埛绔€?
# 鏈湴鏋勫缓琚?Microsoft CDN 涓嬭浇闄愰€燂紙VCTools ~115KB/s锛夐樆濉烇紝鑰?GitHub runner
# 鑷甫瀹屾暣 VS C++ 宸ュ叿閾撅紝鍙湪姝ゆ寜姝ｅ父閫熷害鏋勫缓锛岃閬挎湰鍦扮綉缁滅摱棰堛€?
# 瑙﹀彂锛氭墜鍔紙workflow_dispatch锛夋垨鎺?tag銆?
# 浜х墿鍛藉悕鍖归厤鏈嶅姟鍣?PLATFORM_FILES锛歋ecureChat-<latest>-windows.exe / .zip銆?
# <latest> 浠?server 绔?version.json 鐨?latest 鍙栵紙姝ゅ鍥哄畾 1.62.7锛屾敼鐗堟湰鏃跺悓姝ワ級銆?

on:
  workflow_dispatch:
    inputs:
      version:
        description: '浜х墿鐗堟湰鍙凤紙椤讳笌鏈嶅姟鍣?version.json 鐨?latest 涓€鑷达級'
        required: true
        default: '1.62.7'
  push:
    tags: [ 'flutter-win-*' ]

jobs:
  flutter-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: v
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '1.62.7' }}".Trim()
          if ($ver -eq '') { $ver = '1.62.7' }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get

      - name: Analyze
        working-directory: desktop-build/flutter/securechat
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (release)
        working-directory: desktop-build/flutter/securechat
        run: flutter build windows --release

      - name: Build portable zip
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $src = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          if (Get-Command Compress-Archive -ErrorAction SilentlyContinue) {
            Compress-Archive -Path "$src\*" -DestinationPath "dist\SecureChat-$ver-windows.zip" -Force
          } else {
            7z a "dist\SecureChat-$ver-windows.zip" $src
          }

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          & $iscc "tools\installer.iss" /dAppVer=$ver
          Get-ChildItem dist -Filter "*.exe" | Select-Object -ExpandProperty Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Flutter-Windows
          path: |
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.exe
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.zip
