# Build Flutter native Windows client via GitHub Actions windows-latest runner.
# Trigger: manual (workflow_dispatch) or push tag flutter-win-*.
# Artifact naming: SecureChat-<ver>-windows.exe / .zip

name: Build Flutter Windows


on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (must match server version.json latest)'
        required: true
        default: '1.63.3'
  push:
    tags: [ 'flutter-win-*' ]

jobs:
  flutter-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: v
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '1.63.3' }}".Trim()
          if ($ver -eq '') { $ver = '1.63.3' }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get

      - name: Analyze
        working-directory: desktop-build/flutter/securechat
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (release)
        working-directory: desktop-build/flutter/securechat
        run: flutter build windows --release

      - name: Build portable zip
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $src = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          if (Get-Command Compress-Archive -ErrorAction SilentlyContinue) {
            Compress-Archive -Path "$src\*" -DestinationPath "dist\SecureChat-$ver-windows.zip" -Force
          } else {
            7z a "dist\SecureChat-$ver-windows.zip" $src
          }

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          & $iscc "tools\installer.iss" /dAppVer=$ver
          Get-ChildItem dist -Filter "*.exe" | Select-Object -ExpandProperty Name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Flutter-Windows
          path: |
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.exe
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.zip
