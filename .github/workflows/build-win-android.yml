name: Build Windows + Android

# 在 Windows 本机构建受限（缺 Android SDK / GitHub 网络被墙）。
# 此 workflow 用 GitHub Actions 官方 runner 构建：
#   - windows-latest : Electron 桌面端（.exe / portable .exe / .zip）
#   - ubuntu-latest  : Capacitor Android（.apk，runner 自带 Android SDK）
# 触发：手动（workflow_dispatch）或推送 tag。
# 用法：推到 GitHub 后在 Actions 手动运行，产物在 Artifacts。

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (electron)
        working-directory: desktop-build/electron
        run: npm install

      - name: Build Windows (nsis + portable)
        working-directory: desktop-build/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Windows
          path: |
            desktop-build/electron/dist/*.exe
            desktop-build/electron/dist/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI
        working-directory: desktop-build/capacitor
        run: npm install @capacitor/cli @capacitor/android @capacitor/core --save

      - name: Add Android platform
        working-directory: desktop-build/capacitor
        run: npx cap add android || true

      - name: Sync Android (copy www + config)
        working-directory: desktop-build/capacitor
        run: npx cap sync android

      - name: Build APK (unsigned)
        working-directory: desktop-build/capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Android
          path: desktop-build/capacitor/android/app/build/outputs/apk/**/*.apk
