name: Build iOS and macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'build-latest' }}

jobs:
  ios:
    name: Build iOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-build/capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-build/capacitor/package-lock.json

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: desktop-build/capacitor/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          rm -rf Payload SecureChat-ios-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry SecureChat-ios-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-${{ github.ref_name }}-ios-unsigned
          path: desktop-build/capacitor/ios/App/SecureChat-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --repo "${{ github.repository }}" || true
          gh release upload "$RELEASE_TAG" desktop-build/capacitor/ios/App/SecureChat-ios-unsigned.ipa --clobber --repo "${{ github.repository }}"

  macos:
    name: Build macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-build/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-build/electron/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-${{ github.ref_name }}-macos
          path: desktop-build/electron/dist/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --repo "${{ github.repository }}" || true
          gh release upload "$RELEASE_TAG" desktop-build/electron/dist/*.dmg --clobber --repo "${{ github.repository }}"
