name: Build iOS and macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'build-latest' }}

jobs:
  ios:
    name: Build iOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-build/capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-build/capacitor/package-lock.json

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync web assets
        run: npx cap sync ios

      - name: Import signing certificate
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          security create-keychain -p securechat build.keychain || true
          security default-keychain -s build.keychain
          security unlock-keychain -p securechat build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k securechat build.keychain
          security find-identity -v -p codesigning build.keychain
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build unsigned iOS app
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 == '' }}
        working-directory: desktop-build/capacitor/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          rm -rf Payload SecureChat-ios-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry SecureChat-ios-unsigned.ipa Payload

      - name: Archive and export signed iOS app
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        working-directory: desktop-build/capacitor/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -derivedDataPath build \
            archive
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates
          rm -rf Payload SecureChat-ios-unsigned.ipa
          mkdir Payload
          cp -R build/export/App.app Payload/App.app
          zip -qry SecureChat-ios-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-${{ github.ref_name }}-ios
          path: desktop-build/capacitor/ios/App/SecureChat-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --repo "${{ github.repository }}" || true
          gh release upload "$RELEASE_TAG" desktop-build/capacitor/ios/App/SecureChat-ios-unsigned.ipa --clobber --repo "${{ github.repository }}"

  macos:
    name: Build macOS
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-build/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-build/electron/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-${{ github.ref_name }}-macos
          path: desktop-build/electron/dist/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --generate-notes --repo "${{ github.repository }}" || true
          gh release upload "$RELEASE_TAG" desktop-build/electron/dist/*.dmg --clobber --repo "${{ github.repository }}"
