name: Build Flutter All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (must match server version.json latest)'
        required: true
        default: '1.45.0'
  push:
    tags: ['flutter-all-*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '1.45.0' }}".Trim()
          if ($ver -eq '') { $ver = '1.45.0' }
          "ver=$ver" >> $env:GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get
      - name: Build Windows release
        working-directory: desktop-build/flutter/securechat
        run: flutter build windows --release
      - name: Build portable zip
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $src = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\SecureChat-$ver-windows.zip" -Force
      - name: Build Inno installer
        shell: pwsh
        working-directory: desktop-build/flutter/securechat
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          & $iscc "tools\installer.iss" /dAppVer=$ver
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Windows-Flutter
          path: |
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.exe
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver="${{ github.event.inputs.version || '1.45.0' }}"
          [ -z "$ver" ] && ver="1.45.0"
          echo "ver=$ver" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get
      - name: Build APK
        working-directory: desktop-build/flutter/securechat
        run: flutter build apk --release
      - name: Stage APK
        working-directory: desktop-build/flutter/securechat
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SecureChat-${{ steps.v.outputs.ver }}-android.apk
      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-Android-Flutter
          path: desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-android.apk

  macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver="${{ github.event.inputs.version || '1.45.0' }}"
          [ -z "$ver" ] && ver="1.45.0"
          echo "ver=$ver" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: desktop-build/flutter/securechat
        run: flutter pub get
      - name: Build macOS (x86_64)
        working-directory: desktop-build/flutter/securechat
        run: flutter build macos --release
      - name: Make macOS dmg
        working-directory: desktop-build/flutter/securechat
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/securechat.app"
          dmg="dist/SecureChat-${{ steps.v.outputs.ver }}-macos.dmg"
          rm -f "$dmg"
          hdiutil create -volname SecureChat -srcfolder "$APP" -ov -format UDZO "$dmg"
      - name: Ensure iOS platform files (Podfile)
        working-directory: desktop-build/flutter/securechat
        run: |
          flutter create . --platforms=ios --org com.example.securechat 2>/dev/null || true
          test -f ios/Podfile && echo "Podfile present" || echo "no Podfile"
      - name: Build iOS (unsigned)
        working-directory: desktop-build/flutter/securechat
        run: flutter build ios --release --no-codesign
      - name: Make iOS ipa
        working-directory: desktop-build/flutter/securechat
        run: |
          ditto -c -k --keepParent "build/ios/iphoneos/Runner.app" "dist/SecureChat-${{ steps.v.outputs.ver }}-ios.ipa"
      - name: Upload macOS + iOS
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-macOS+iOS-Flutter
          path: |
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-macos.dmg
            desktop-build/flutter/securechat/dist/SecureChat-${{ steps.v.outputs.ver }}-ios.ipa

  release:
    runs-on: ubuntu-latest
    needs: [windows, android, macos-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ver="${{ github.event.inputs.version || '1.45.0' }}"
          [ -z "$ver" ] && ver="1.45.0"
          echo "ver=$ver" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: flutter-rel-${{ steps.v.outputs.ver }}
          name: "SecureChat ${{ steps.v.outputs.ver }} (Flutter)"
          body: "Flutter native client all-platform artifacts. windows installer + portable zip, android apk, macos dmg, ios ipa (unsigned)."
          artifacts: "artifacts/*"
          allowUpdates: true
          prerelease: false
