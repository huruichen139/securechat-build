name: Build macOS + iOS

# 在 Windows 上无法构建 macOS .dmg 和 iOS .ipa（需 Mac + Xcode）。
# 此 workflow 在 GitHub Actions 的 macos-latest runner 上自动构建。
# 触发：手动（workflow_dispatch）或推送 tag。
#
# 使用方式：
#   1. 把本项目推到 GitHub 仓库
#   2. 在 Actions 页面手动运行此 workflow（或推一个 tag，如 v1.1.0）
#   3. 构建完成后在 Artifacts 区域下载 .dmg 和 .ipa
#
# 注意：
#   - 未签名。macOS .dmg 首次打开需右键 → 打开（Gatekeeper 绕过）。
#   - iOS .ipa 未签名，只能用免费 Apple ID 通过 Xcode 本地安装到自己的设备。
#     如需分发到 App Store，需配置 Apple Developer 证书（$99/年）并加 secrets。

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  mac-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (electron)
        working-directory: desktop-build/electron
        run: npm install

      - name: Build macOS .dmg (arm64)
        working-directory: desktop-build/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_HARD_LINKS: 'false'
        run: npx electron-builder --mac dmg --arm64

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-macOS
          path: desktop-build/electron/dist/*.dmg

      - name: Install Capacitor CLI
        working-directory: desktop-build/capacitor
        run: npm install @capacitor/cli @capacitor/ios @capacitor/core --save

      - name: Add iOS platform
        working-directory: desktop-build/capacitor
        run: npx cap add ios || true

      - name: Sync iOS
        working-directory: desktop-build/capacitor
        run: npx cap sync ios

      - name: Build iOS .ipa (unsigned, for local install via Xcode)
        working-directory: desktop-build/capacitor/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build && zip -r SecureChat-1.0.0-ios-unsigned.ipa Payload

      - name: Upload iOS .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-iOS
          path: desktop-build/capacitor/ios/App/build/*.ipa
