<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>充值支付 - securechat</title>
<link rel="icon" href="data:," />
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #ededed; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; }
  .card { box-sizing: border-box; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 36px 30px; text-align: center; max-width: 360px; width: calc(100% - 32px); box-shadow: none; }
  h1 { font-size: 18px; font-weight: 700; color: #191919; }
  p { font-size: 13px; color: #6b7280; line-height: 1.7; }
</style>
<style>
  :root{--p-paper:#f3f1ea;--p-paper2:#fbfaf6;--p-ink:#171a16;--p-sub:#4f544d;--p-line:#d8d4c8;--p-line2:#bcb7a9;--p-green:#1f6f4a;--p-green-d:#155237;--p-serif:Georgia,"Songti SC","Noto Serif SC","SimSun",serif}
  body{background:var(--p-paper)!important;color:var(--p-ink)!important}
  .card{background:var(--p-paper2)!important;border:1px solid var(--p-line2)!important;border-radius:2px!important;box-shadow:10px 10px 0 rgba(23,26,22,.1)!important}
  h1{font-family:var(--p-serif)!important;font-weight:600!important;color:var(--p-ink)!important;letter-spacing:-.03em!important}
  p{color:var(--p-sub)!important}
  div[style*="color:#07c160"]{color:var(--p-green-d)!important}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:44px;font-weight:800;color:#07c160">&#10003;</div>
  <h1>支付已完成</h1>
  <p>余额将在几秒内自动到账，请回到 SecureChat 查看钱包余额。<br>如未到账请稍后在钱包页下拉刷新。</p>
</div>
</body>
</html>
