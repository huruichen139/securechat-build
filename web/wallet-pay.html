<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>充值支付 - SecureChat</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f3f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 16px; padding: 32px; text-align: center; max-width: 360px; width: calc(100% - 32px); box-shadow: 0 4px 20px rgba(0,0,0,.08); }

  p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
</style>

<body>
<div class="card">
  <div style="font-size:40px">✅</div>
  <h1>支付已完成</h1>

</div>

</html>
