<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPay 商户中心 - SecureChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #ededed; min-height: 100vh; display: flex; justify-content: center; padding: 40px 12px; color: #191919; -webkit-font-smoothing: antialiased; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 32px; width: 100%; max-width: 520px; box-shadow: none; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
  .sub { color: #6b7280; font-size: 13px; line-height: 1.6; margin-bottom: 22px; }
  .row { margin-bottom: 14px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: #6b7280; margin-bottom: 6px; }
  input[type=text], input[type=password] { width: 100%; padding: 11px 14px; background: #f7f7f7; border: 1px solid transparent; border-radius: 4px; font-size: 14px; color: #191919; outline: none; transition: background .15s, border-color .15s; }
  input:focus { background: #fff; border-color: #07c160; box-shadow: none; }
  .btn { display: inline-block; border: none; border-radius: 4px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; background: #07c160; color: #fff; box-shadow: none; transition: opacity .15s; }
  .btn.gray { background: #f1f3f7; color: #4b5563; box-shadow: none; }
  .btn.orange { background: #f59e0b; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .tip { font-size: 12px; color: #94a3b8; margin-top: 6px; min-height: 16px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .badge.ok { background: #e8f8ef; color: #07c160; }
  .badge.wait { background: #fef9c3; color: #a16207; }
  .badge.no { background: #fee2e2; color: #b91c1c; }
  .keybox { display: flex; gap: 8px; }
  .keybox input { flex: 1; font-family: monospace; font-size: 12px; }
  .hidden { display: none; }
  a.back { color: #07c160; text-decoration: none; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h1>EPay 商户中心</h1>
    <a class="back" href="/">← 返回</a>
  </div>

  <div id="loginView">
    <p class="sub">请先在主应用登录，或输入访问令牌</p>
    <div class="row">
      <label>访问令牌 (Token)</label>
      <input type="password" id="tokenInput" placeholder="粘贴 sc_token">
    </div>
    <button class="btn" id="loginBtn">进入商户中心</button>
    <div class="tip" id="loginTip"></div>
  </div>

  <div id="mainView" class="hidden">
    <p class="sub">管理你的商户信息与 API 密钥 <span id="statusBadge"></span></p>

    <div class="row">
      <label>商户名称</label>
      <input type="text" id="mName">
    </div>
    <div class="row">
      <label>回调地址（HTTPS）</label>
      <input type="text" id="mCallback" placeholder="https://your.site/notify">
    </div>
    <div class="row">
      <label>API 密钥（对接 /epaygw/submit.php 签名用）</label>
      <div class="keybox">
        <input type="password" id="mKey" readonly>
        <button class="btn gray" id="keyShowBtn">显示</button>
        <button class="btn gray" id="keyCopyBtn">复制</button>
      </div>
      <div class="tip">密钥由系统生成，可自行重置；重置后旧密钥立即失效。</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" id="saveBtn">保存修改</button>
      <button class="btn orange" id="regenBtn">重置密钥</button>
    </div>
    <div class="tip" id="mainTip"></div>

    <hr style="border:none;border-top:1px solid #e5e5e5;margin:20px 0">
    <p class="sub">对接示例：MD5(参数按 key 排序 k=v&amp; 拼接 + 密钥) 作为 sign 提交到 <code>/epaygw/submit.php</code></p>
  </div>
</div>
<script src="merchant.js?v=merchant-20261107-1"></script>
</body>
</html>
